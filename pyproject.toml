[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxd"
version = "0.1.4"
description = "Voice dictation daemon for Linux with Sarvam AI STT"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "voxd contributors"}
]
keywords = ["voice", "dictation", "stt", "speech-to-text", "linux", "daemon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
  "sarvamai>=0.1.15",
]

[project.urls]
Homepage = "https://github.com/yourusername/voxd"
Repository = "https://github.com/yourusername/voxd"
Issues = "https://github.com/yourusername/voxd/issues"

[project.scripts]
voxd = "voxd.cli:main"
voxd-daemon = "voxd.cli:daemon"
voxd-x11 = "voxd.wrappers.x11:main"
voxd-wayland = "voxd.wrappers.wayland:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
